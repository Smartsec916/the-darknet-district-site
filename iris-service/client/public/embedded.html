    .iris-avatar-img {
      display: block;
      border-radius: 50%;
      background: var(--iris-avatar) center / cover no-repeat;
    }

    /* Main chat button: the ChatBot launcher (accents.css ".tdd-iris") as a dot */
    #iris-chat-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100000;
      border: 1px solid rgba(255, 51, 102, 0.45);
      background: rgba(20, 0, 8, 0.45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #ffd0dc;
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.12);
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
    }

    #iris-chat-button:hover,
    #iris-chat-button:focus-visible {
      background: rgba(255, 51, 102, 0.14);
      color: #fff;
      border-color: rgba(255, 51, 102, 0.9);
      box-shadow: 0 0 40px rgba(255, 51, 102, 0.25);
      outline: none;
    }

    /* Portrait with the rotating dashed ring, in the ChatBot's 26:34 proportions */
    .iris-avatar {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .iris-avatar .iris-avatar-img {
      position: absolute;
      inset: 6px;
      width: 36px;
      height: 36px;
    }

    .iris-avatar svg {
      position: absolute;
      inset: 0;
      width: 48px;
      height: 48px;
      animation: iris-rotate 4s linear infinite;
    }

    .iris-avatar circle {
      fill: none;
      stroke: var(--primary-color);
      stroke-width: 1;
      stroke-dasharray: 20 86;
      stroke-linecap: round;
    }

    @keyframes iris-rotate {
      to { transform: rotate(360deg); }
    }

    /* Chat container: the ChatBot window */
    #iris-chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: var(--chat-width);
      height: var(--chat-height);
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 110px);
      background: rgba(15, 15, 20, 0.15);
      border: 2px solid var(--border-color);
      border-radius: 15px;
      z-index: 99999;
      overflow: hidden;
      display: none;
      flex-direction: column;
      color: var(--text-color);
      font-family: 'Courier New', monospace;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      box-shadow: 0 0 20px var(--glow-color);
      animation: screenFlicker 8s infinite;
    }

    @keyframes screenFlicker {
      0% { opacity: 1; }
      1% { opacity: 0.95; }
      2% { opacity: 0.9; }
      3% { opacity: 1; }
      98% { opacity: 1; }
      99% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    /* Chat header */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background: linear-gradient(45deg, rgba(255, 51, 102, 0.6), rgba(255, 0, 68, 0.6));
      border-bottom: none;
    }

    .chat-header .profile-pic {
      width: 35px;
      height: 35px;
      margin-right: 12px;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
      flex-shrink: 0;
    }

    .chat-header h3 {
      margin: 0;
      flex-grow: 1;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .close-chat {
      color: #ffffff;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* Chat messages */
    .chat-messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 25, 0.4);
    }

    .message {
      max-width: 80%;
      margin-bottom: 12px;
      padding: 10px 15px;
      border-radius: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-deep));
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .iris-message {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-bottom-left-radius: 5px;
      border-left: 3px solid var(--primary-color);
    }

    /* Chat input */
    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid var(--terminal-green);
    }

    .chat-input input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid var(--terminal-green);
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--terminal-green);
      margin-right: 5px;
      font-family: 'Courier New', monospace;
    }

    .chat-input button {
      background: var(--terminal-green);
      color: black;
      border: none;
      border-radius: 5px;
      padding: 8px 15px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    .chat-input button:hover {
      background: var(--terminal-green-hover);
    }

    /* Cyberpunk effects: the ChatBot's green scanlines */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 157, 0.03) 0px,
        rgba(0, 255, 157, 0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      animation: scanline 10s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(600px); }
    }

    /* Typing indicator: bubble like an Iris message, green dots like the ChatBot's */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border-left: 3px solid var(--primary-color);
      border-radius: 15px;
      border-bottom-left-radius: 5px;
      padding: 10px 15px;
      margin-bottom: 12px;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--terminal-green);
      margin-right: 5px;
      animation: typing 1s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
      margin-right: 0;
    }

    @keyframes typing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .message p {
      margin: 0;
      word-break: break-word;
    }

    /* Glitch effects (unused by the current markup; recolored to match) */
    .glitch {
      position: relative;
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    .glitch::before {
      left: -2px;
      text-shadow: 2px 0 #00ff9d;
      animation: glitch-1 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: 2px;
      text-shadow: -2px 0 #ff3366;
      animation: glitch-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-1 {
      0%, 80%, 100% { clip-path: inset(0 0 0 0); }
      20% { clip-path: inset(10% 0 80% 0); }
      40% { clip-path: inset(50% 0 40% 0); }
      60% { clip-path: inset(30% 0 60% 0); }
    }

    @keyframes glitch-2 {
      0%, 80%, 100% { clip-path: inset(0 0 0 0); }
      20% { clip-path: inset(60% 0 20% 0); }
      40% { clip-path: inset(10% 0 70% 0); }
      60% { clip-path: inset(70% 0 10% 0); }
    }

    /* Link to the full view, in the header */
    #direct-link {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin-left: 10px;
      font-size: 12px;
    }

    #direct-link:hover {
      color: #fff;
    }

    /* Same reduced-motion handling as the ChatBot's ring */
    @media (prefers-reduced-motion: reduce) {
      .iris-avatar svg,
      #iris-chat-container,
      .scan-line {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Iris Chat Button -->
  <div id="iris-chat-button">
    <span class="iris-avatar" aria-hidden="true">
      <span class="iris-avatar-img"></span>
      <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16.5"></circle></svg>
    </span>
  </div>
  
  <!-- Iris Chat Container -->
  <div id="iris-chat-container">
    <div class="scan-line"></div>
    <div class="chat-header">
      <span class="iris-avatar-img profile-pic" role="img" aria-label="Iris"></span>
      <h3>Iris AI</h3>
      <a id="direct-link" href="https://iris-chat-interface-smartsec916.replit.app/" target="_blank">Full View</a>
      <button class="close-chat">×</button>
    </div>
    
    <div class="chat-messages">
      <!-- Messages will be dynamically added here -->
      <div class="message iris-message">
        <p>Connection established. I'm Iris, your digital guide to the Darknet District. How can I assist you today?</p>
      </div>
      <div class="typing-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    
    <div class="chat-input">
      <input type="text" placeholder="Type your message...">
      <button>Send</button>
    </div>
  </div>

  <script>
    // Set up chat functionality
    document.addEventListener('DOMContentLoaded', function() {
      const chatButton = document.getElementById('iris-chat-button');
      const chatContainer = document.getElementById('iris-chat-container');
      const closeButton = document.querySelector('.close-chat');
      const chatInput = document.querySelector('.chat-input input');
      const sendButton = document.querySelector('.chat-input button');
      const messagesContainer = document.querySelector('.chat-messages');
      const typingIndicator = document.querySelector('.typing-indicator');
      
      // Session ID for Iris
      let sessionId = null;
      
      // Toggle chat container visibility
      chatButton.addEventListener('click', function() {
        if (chatContainer.style.display === 'none' || chatContainer.style.display === '') {
          chatContainer.style.display = 'flex';
          setTimeout(() => chatInput.focus(), 300);
          
          // Initialize chat session if needed
          if (!sessionId) {
            initChatSession();
          }
        } else {
          chatContainer.style.display = 'none';
        }
      });
      
      // Close chat on button click
      closeButton.addEventListener('click', function() {
        chatContainer.style.display = 'none';
      });
      
      // Send message on button click or Enter key
      function sendMessage() {
        const message = chatInput.value.trim();
        if (message && sessionId) {
          // Add user message to chat
          addMessage('user', message);
          chatInput.value = '';
          
          // Show typing indicator
          typingIndicator.style.display = 'block';
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
          
          // Send to Iris API
          fetch('https://iris-chat-interface-smartsec916.replit.app/api/chat/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message })
          })
          .then(response => response.json())
          .then(data => {
            // Hide typing indicator and add Iris response
            typingIndicator.style.display = 'none';
            if (data && data.response) {
              addMessage('iris', data.response);
            } else {
              addMessage('iris', "I'm having trouble connecting to my systems. Can you try again?");
            }
          })
          .catch(error => {
            console.error('Error:', error);
            typingIndicator.style.display = 'none';
            addMessage('iris', "Connection error. I seem to be having trouble reaching my network. Please try again later.");
          });
        }
      }
      
      // Initialize chat session with backend
      function initChatSession() {
        fetch('https://iris-chat-interface-smartsec916.replit.app/api/chat/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
          if (data && data.sessionId) {
            sessionId = data.sessionId;
            console.log("Chat session initialized:", sessionId);
          }
        })
        .catch(error => {
          console.error('Session initialization error:', error);
        });
      }
      
      // Add message to chat container
      function addMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        
        const messageText = document.createElement('p');
        messageText.textContent = text;
        messageDiv.appendChild(messageText);
        
        messagesContainer.appendChild(messageDiv);
        
        // Auto-scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
      
      // Event listeners
      sendButton.addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    });
  </script>
</body>
</html>
