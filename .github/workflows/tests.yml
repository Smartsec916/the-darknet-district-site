name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit tests use only node:test, so no npm install is needed.
      - run: node --test tests/*.test.cjs

  python:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-void-runner.txt
      - run: pip install -r requirements-void-runner.txt
      - name: Blackout Protocol API
        run: python -m unittest discover -s blackout-protocol -p test_api.py
      - name: Iris chat and VOID//RUNNER API
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}

  browser:
    name: Babylon stabilization smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Real-asset scene, timing, VR and HUD regression
        run: |
          node tests/serve-modern.cjs > /tmp/void-test-host.log 2>&1 &
          node tests/stabilization-browser.cjs
        env:
          BROWSER_CHANNEL: chromium
          STABILIZATION_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stabilization-browser
          path: work/stabilization
