name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Hub WebSocket tests import ws from the root test tooling dependencies.
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - name: District hub WebSocket contracts
        run: node --test tests/district-hub-ws.cjs tests/district-hub-trade-ws.cjs tests/district-hub-prod-ws.cjs

  python:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-void-runner.txt
      - run: pip install -r requirements-void-runner.txt
      - name: Blackout Protocol API
        run: python -m unittest discover -s blackout-protocol -p test_api.py
      - name: Iris chat and VOID//RUNNER API
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}

  browser:
    name: Babylon stabilization smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real-asset scene, timing, VR and HUD regression
        run: |
          node tests/serve-modern.cjs > /tmp/void-test-host.log 2>&1 &
          node tests/stabilization-browser.cjs
          node tests/blackout-tesana-browser.cjs
          node tests/skirmish-balance-browser.cjs
          node tests/npc-capability-browser.cjs
        env:
          BROWSER_CHANNEL: chromium
          STABILIZATION_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stabilization-browser
          path: work/stabilization

  food-stands:
    name: Food stand integration browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/serve-modern.cjs > /tmp/food-stand-test-host.log 2>&1 &
          node tests/ncz-food-stands-browser.cjs


  rig-workshop:
    name: Companion and NPC rig repair in Babylon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/rig-workshop-browser.cjs
