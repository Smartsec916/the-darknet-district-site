name: Refresh Nomi Se7en inventory
on:
  push:
    branches: [codex/companion-foot-alignment]
    paths:
      - '.github/workflows/refresh-nomi-se7en-inventory.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/companion-foot-alignment
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Regenerate and verify projection
        run: |
          node tools/admin-inventory.cjs
          node --test tests/admin-inventory.test.cjs tests/modules.test.cjs
      - name: Commit generated inventory and remove temporary workflow
        run: |
          rm .github/workflows/refresh-nomi-se7en-inventory.yml
          git add void_runner_admin_inventory.json .github/workflows/refresh-nomi-se7en-inventory.yml
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate companion admin inventory after Nomi Se7en room anchors'
          git push origin HEAD:codex/companion-foot-alignment
