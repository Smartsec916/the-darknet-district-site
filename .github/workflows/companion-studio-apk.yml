name: Companion Studio Android APK
on:
  push:
    branches: [codex/companion-studio-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: android/companion-studio
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --silent --show-error --location https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses >/dev/null
          "$manager" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Build and verify APK
        run: bash android/companion-studio/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CompanionStudio-Android
          path: android/companion-studio/build/CompanionStudio.apk
          if-no-files-found: error
          retention-days: 30
