<!doctype html>
<!-- Kit piece viewer: loads District interior kit pieces into a small Babylon.js scene the way the game does (one shared PBR material per kit_* name, the game's
     tone mapping and code-built environment), so a new piece can be checked for materials, normals, vertex-colour wear, emissive parts and tiling before it is
     placed in the game. Serve the repository root (node tests/serve-modern.cjs) and open
       /tools/assets/kit/piece-viewer.html?pieces=district_hall_wall_4m_a,district_hall_services_4m@3&tile=3&view=quarter
     pieces: name[@height]; tile: how many copies side by side; view: front | quarter | close | graze | back; light: lit | dim | flat; wire=1; nocolor=1. -->
<html><head><meta charset="utf-8"><title>Kit piece viewer</title><meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#050608;overflow:hidden}canvas{width:100%;height:100%;display:block}#info{position:fixed;left:8px;bottom:8px;color:#9fb;font:12px monospace;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="info"></div>
<script src="../../../void-runner/vendor/babylon-8.26.0.js"></script>
<script src="../../../void-runner/vendor/babylonjs-loaders-8.26.0.min.js"></script>
<script>
(async()=>{
const B=BABYLON,q=new URLSearchParams(location.search),canvas=document.getElementById('c');
const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true}),scene=new B.Scene(engine);scene.clearColor=new B.Color4(.012,.013,.016,1);
const pieces=(q.get('pieces')||'district_hall_wall_4m_a').split(',').map(s=>{const [name,y]=s.split('@');return {name,y:+y||0};}),tile=+q.get('tile')||3,view=q.get('view')||'quarter',light=q.get('light')||'lit';
const models='../../../void-runner/assets/models/district-interior/',tex='../../../void-runner/assets/textures/district-interior/';
// the game's look (babylon-renderer.js, neochinatown.js)
const ip=scene.imageProcessingConfiguration;ip.toneMappingEnabled=true;ip.toneMappingType=B.ImageProcessingConfiguration.TONEMAPPING_ACES;ip.exposure=1.3;ip.contrast=1.18;
{const s=new B.Scene(engine),cam=new B.FreeCamera('env',B.Vector3.Zero(),s);s.activeCamera=cam;const dome=B.MeshBuilder.CreateSphere('d',{diameter:400,segments:16,sideOrientation:B.Mesh.BACKSIDE},s);
 const t=new B.DynamicTexture('g',{width:8,height:256},s,false),g=t.getContext(),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#9aa6b4');gr.addColorStop(.45,'#4a5360');gr.addColorStop(.55,'#2a2f36');gr.addColorStop(1,'#0c0e11');g.fillStyle=gr;g.fillRect(0,0,8,256);t.update();
 const dm=new B.StandardMaterial('d',s);dm.emissiveTexture=t;dm.disableLighting=true;dome.material=dm;const probe=new B.ReflectionProbe('p',128,s);probe.refreshRate=B.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;probe.renderList.push(dome);
 for(let i=0;i<4;i++){const st=B.MeshBuilder.CreatePlane('s',{width:120,height:10},s),a=i*Math.PI/2;st.position.set(Math.cos(a)*150,90,Math.sin(a)*150);st.lookAt(B.Vector3.Zero());const m=new B.StandardMaterial('s',s);m.emissiveColor=new B.Color3(1.6,1.55,1.45);m.disableLighting=true;st.material=m;probe.renderList.push(st);}
 s.render();scene.environmentTexture=probe.cubeTexture;scene.environmentIntensity=light==='flat'?1:.3;}
const mats={},T=(n,k)=>{const t=new B.Texture(tex+n+'_'+k+'.jpg',scene,false,false);t.wrapU=t.wrapV=B.Texture.WRAP_ADDRESSMODE;return t;};
const kitMat=name=>{if(mats[name])return mats[name];const m=new B.PBRMaterial('ncz-'+name,scene);
 if(name==='kit_emissive'){m.albedoColor=B.Color3.Black();m.roughness=1;m.metallic=0;m.emissiveTexture=T(name,'color');m.emissiveColor=B.Color3.White();m.emissiveIntensity=1.6;}
 else{const c=T(name,'color'),orm=T(name,'orm');m.albedoTexture=c;m.bumpTexture=T(name,'normal');m.invertNormalMapX=true;m.invertNormalMapY=false;m.metallicTexture=orm;m.metallic=1;m.roughness=1;m.useRoughnessFromMetallicTextureAlpha=false;m.useRoughnessFromMetallicTextureGreen=true;m.useMetallnessFromMetallicTextureBlue=true;m.useAmbientOcclusionFromMetallicTextureRed=true;
  m.emissiveTexture=c;m.emissiveColor=/^kit_(gunmetal|steel|paint)$/.test(name)?new B.Color3(.1,.105,.125):new B.Color3(.2,.21,.25);}
 if(q.get('wire'))m.wireframe=true;return mats[name]=m;};
let width=4,tris=0,meshes=0;
for(const p of pieces){const r=await B.SceneLoader.ImportMeshAsync('',models,p.name+'.glb',scene),rootNode=r.meshes[0];
 for(const m of r.meshes){if(!m.getTotalVertices||!m.getTotalVertices()||!m.material)continue;m.material=kitMat(String(m.material.name).replace(/^.*(kit_[a-z]+).*$/,'$1'));m.hasVertexAlpha=false;if(q.get('nocolor'))m.useVertexColors=false;tris+=m.getTotalIndices()/3;meshes++;}
 const bb=rootNode.getHierarchyBoundingVectors();if(p===pieces[0])width=Math.round((bb.max.x-bb.min.x)*100)/100;rootNode.position.y=p.y;
 for(let i=1;i<tile;i++){const c=rootNode.instantiateHierarchy(null,{doNotInstantiate:true});c.position.set(-i*width,p.y,0);}   // glTF roots are mirrored in X, so copies step in -X here
}
// a floor and the game-like lights: a cool overhead key, a warm low fill
const floor=B.MeshBuilder.CreateGround('floor',{width:40,height:12},scene);floor.position.set(0,0,3);floor.material=kitMat('kit_tile');
if(light!=='flat'){const span=tile*width,k=light==='dim'?.35:1;for(let i=0;i<tile;i++){const l=new B.PointLight('k'+i,new B.Vector3(-(i+.5)*width+width,3.6,2.2),scene);l.diffuse=new B.Color3(.75,.86,1);l.intensity=14*k;l.range=9;}
 const f=new B.PointLight('f',new B.Vector3(-span/2+width,.8,4),scene);f.diffuse=new B.Color3(1,.7,.45);f.intensity=5*k;f.range=10;}
else{const h=new B.HemisphericLight('h',new B.Vector3(0,1,.4),scene);h.intensity=1.2;}
const mid=-(tile*width)/2+width,cam=new B.FreeCamera('cam',B.Vector3.Zero(),scene);cam.minZ=.05;cam.fov=.8;
const V={front:[[mid,1.6,7.5],[mid,1.6,0]],quarter:[[mid+4.2,1.7,5.2],[mid-.6,1.5,0]],close:[[width/2-.4,1.75,1.7],[width/2+.9,1.75,0]],graze:[[width+.4,1.6,.9],[-tile*width+width,1.5,.05]],back:[[mid,1.6,-6],[mid,1.6,0]]}[view]||[[mid,1.6,7.5],[mid,1.6,0]];
if(q.get('cam')){const n=q.get('cam').split(',').map(Number);V[0]=n.slice(0,3);V[1]=n.slice(3,6);}
cam.position.set(...V[0]);cam.setTarget(new B.Vector3(...V[1]));
engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
await scene.whenReadyAsync();
const inst=new B.SceneInstrumentation(scene);inst.captureFrameTime=true;const di=new B.EngineInstrumentation(engine);
window.viewer={ready:true,tris:Math.round(tris)*tile,meshes:meshes*tile,width,get drawCalls(){return scene.getEngine()._drawCalls?.current??null;},get fps(){return engine.getFps();},materials:Object.keys(mats)};
document.getElementById('info').textContent=pieces.map(p=>p.name).join(' + ')+'  x'+tile+'\ntriangles '+window.viewer.tris+'  materials '+Object.keys(mats).join(', ');
})().catch(e=>{document.getElementById('info').textContent='ERROR '+e.message;window.viewer={error:String(e&&e.stack||e)};});
</script></body></html>
