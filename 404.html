<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Absolute paths: GitHub Pages serves this page for any missing URL, at any depth. -->
  <link href="/style.css" rel="stylesheet" type="text/css">
  <style>
    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
      z-index: 9999;
    }

    .top-nav a {
      font-family: 'Courier New', monospace;
      color: #00ffcc;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid #00ffcc;
      border-radius: 4px;
      transition: background-color 0.3s, color 0.3s;
    }

    .top-nav a:hover,
    .top-nav a:focus-visible {
      background-color: #00ffcc;
      color: black;
      outline: none;
    }

    .signal-lost {
      min-height: calc(100vh - 60px);
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.55), black 85%),
        url('/attached_assets/epsiloncircle_420_Dark_cyberpunk_cityscape_at_night_glowing_neo_0ca6182c-0ff0-4948-bdfd-a6f406667165.webp') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 60px;
      text-align: center;
    }

    .error-code {
      font-family: 'Courier New', monospace;
      color: #ff3366;
      letter-spacing: 6px;
      font-size: 0.95rem;
      text-transform: uppercase;
      margin: 0;
    }

    .iris-line {
      display: flex;
      gap: 14px;
      align-items: center;
      max-width: 460px;
      margin: 10px auto 0;
      text-align: left;
      background: rgba(0, 0, 0, 0.6);
      border-left: 3px solid #ff3366;
      padding: 12px 16px;
      font-family: 'Courier New', monospace;
      color: #e4e4e4;
      line-height: 1.5;
    }

    .iris-line img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #ff3366;
      flex-shrink: 0;
    }

    .iris-line strong {
      display: block;
      color: #ff3366;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .signal-lost .game-button {
      margin-top: 40px;
      display: inline-block;
    }
  </style>
</head>

<body>
  <nav class="top-nav" aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/games-list.html">Arcade</a>

    <a href="/sleeping_pod.html">Sleeping Pod</a>
    <a href="/about.html">About</a>

  <main class="signal-lost">
    <p class="error-code">Error 404 // Route not found</p>
    <h1 class="cyberpunk-title" data-text="Signal Lost">Signal Lost</h1>

    <div class="iris-line">
      <img src="/attached_assets/Iris%2001.webp" alt="Iris">
      <p style="margin: 0;"><strong>IRIS</strong>That sector doesn't exist. Either the link is dead or someone scrubbed it. I'd head back to street level.</p>
    </div>

    <a class="game-button" href="/">Back to the District</a>
  </main>
</body>
